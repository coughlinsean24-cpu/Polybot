polymarket:
  chain_id: 137
  funder_address: '0x05c335f7048d216162fcbad355daf9fb3dbd3f7f'
  signature_type: 1
price_feeds:
  # Ordered list of WebSocket endpoints -- bot tries each in order until one works
  ws_endpoints:
    - url: wss://ws-feed.exchange.coinbase.com
      type: coinbase          # US-friendly, no API key needed
    - url: wss://stream.binance.us:9443/ws/btcusdt@trade
      type: binance           # Binance US (backup)
  coingecko_url: https://api.coingecko.com/api/v3/simple/price
strategy:
  initial_bankroll: 350.0
  initial_bet: 5.0
  max_bet: 25.0
  conviction_max_bet: 25.0
  conviction_edge: 0.12
  reset_profit_target: 200
  max_loss: 400.0
  min_bankroll: 5.0
  min_edge: 0.05
  max_spread: 0.10
  fill_bump: 0.03
  max_slippage: 0.02
  take_profit: 0.7
  limit_sell_profit: 0.02
  stop_loss: 0.4
  bet_mode: kelly
  kelly_fraction: 0.35
  compound:
    enabled: true               # reinvest profits, snowball wins
    profit_reinvest_pct: 0.60   # reinvest 60% of profits, bank the other 40%
    max_bet_pct: 0.20           # never bet more than 20% of bankroll
    floor: 300.0                # protect $300 base (only risk profits above this)
    ratchet_after: 3.0          # raise floor by $3 per $3 profit (lock in gains faster)
    gears:
      enabled: true
      cold_win_rate: 0.45       # below this = defensive mode
      hot_win_rate: 0.60        # above this = aggressive mode
      cold_reinvest_pct: 0.30   # defensive: reinvest 30% of profits
      hot_reinvest_pct: 0.60    # aggressive: reinvest 60% of profits
    drawdown:
      enabled: true
      threshold: 0.15           # 15% drop from peak = moderate throttle
      multiplier: 0.50          # cut bet size in half during moderate drawdown
      severe_threshold: 0.30    # 30% drop from peak = severe throttle
      severe_multiplier: 0.25   # quarter bet size during severe drawdown
    streak:
      enabled: true
      threshold: 3              # 3 consecutive wins to activate streak bonus
      boost_pct: 0.25           # +25% bet per streak level above threshold
      max_boost: 3.0            # never boost beyond 3x the base bet
    lock_in:
      enabled: true
      pct: 0.25                 # lock 25% of every win into the floor permanently
scalp:
  enabled: true
  max_entries_per_window: 10
  cooldown_after_take_profit: 3
  cooldown_after_stop_loss: 10
straddle:
  enabled: false             # disabled -- 0% win rate, -$40 lifetime drain
  trigger_seconds: 60
  max_diff_pct: 0.02
  limit_price: 0.05
  shares: 50
  max_cost: 5.0
preposition:
  enabled: false             # DISABLED: speculative, not delay-based
  trigger_seconds: 30        # start looking for preposition in last N seconds of window
  min_momentum_pct: 0.03    # BTC must have moved this % from window open (directional move)
  min_accel_pct: 0.005      # diff_pct must have grown by this much since last scan (accelerating)
  max_price: 0.55           # max price to pay on next window (near 50/50 = cheap)
  bet_fraction: 0.35         # fraction of normal bet size to use (cautious -- prepos has lower WR)
hedge:
  enabled: true
  min_prob: 0.80           # our probability must be this high before hedging
  min_profit_pct: 0.10     # only hedge if guaranteed profit >= 10% of cost
  max_hedge_cost: 3.0      # max USDC to spend on insurance side
  min_seconds_left: 30     # need at least this much time left to place hedge
parlay:
  enabled: false             # "Double It & Pass" mode -- start small, compound wins
  initial_stake: 1.00        # starting bet ($1 default -- max you can lose per streak)
  max_rounds: 8              # auto-pass after this many consecutive wins (2^8 = $256)
  take_profit: 100.00        # auto-pass if accumulated profit hits this threshold
  use_normal_signals: true   # ride on normal bot signals (no extra orders)
dual_side:
  enabled: false              # "Both-sides" mode: limit-buy UP + DOWN, hold to resolution
  budget: 40.0                # total USDC per window ($20 each side)
  max_price: 0.47             # max limit price per side (sum < $1.00 = guaranteed profit if both fill)
  min_seconds_to_place: 240   # place orders when >= this many seconds remain in window
  cancel_unfilled_at: 10      # cancel unfilled side with this many seconds left
risk:
  max_concurrent_positions: 1
  cooldown_after_loss: 30
  max_consecutive_losses: 5
safety:
  hard_max_per_trade: 25.0   # absolute max USDC on any single trade (overrides Kelly/conviction)
  max_per_window: 100.0       # total USDC spent in one 5-min window
  session_loss_limit: 50.0    # cumulative loss $ that halts all new trades until restart
  min_ta_quality: 0.30        # minimum TA alignment score (0-1) to allow a trade
technical_analysis:
  rsi_period: 14              # RSI look-back samples (~14s at 1 sample/sec)
  bb_period: 20               # Bollinger Band look-back
  bb_std: 2.0                 # Bollinger Band standard deviations
  roc_period: 30              # Rate-of-change look-back (~30s)
  trend_period: 60            # linear-regression trend look-back (~60s)
  ema_fast: 10                # fast EMA period for crossover
  ema_slow: 30                # slow EMA period for crossover
  min_samples: 60             # minimum price samples before TA is computed
logging:
  db_path: ./data/trades.db
  log_level: INFO

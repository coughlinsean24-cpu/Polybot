polymarket:
  chain_id: 137
  funder_address: '0x05c335f7048d216162fcbad355daf9fb3dbd3f7f'
  signature_type: 1
price_feeds:
  binance_ws: wss://stream.binance.com:9443/ws/btcusdt@trade
  coingecko_url: https://api.coingecko.com/api/v3/simple/price
strategy:
  initial_bet: 15.0
  max_bet: 15.0
  conviction_max_bet: 30.0
  conviction_edge: 0.30
  reset_profit_target: 200
  max_loss: 400.0
  min_edge: 0.01
  max_spread: 0.10
  fill_bump: 0.05
  max_slippage: 0.03
  take_profit: 0.7
  limit_sell_profit: 0.25
  stop_loss: 0.4
  bet_mode: kelly
  kelly_fraction: 0.25
  compound:
    enabled: true
    profit_reinvest_pct: 0.50   # reinvest 50% of profits, bank the other 50%
    max_bet_pct: 0.10           # never bet more than 10% of bankroll
    floor: 10.0                 # never let bankroll drop below this (protected base)
    ratchet_after: 5.0          # raise the floor by $5 every time bankroll grows $5 above it
scalp:
  enabled: true
  max_entries_per_window: 3
  cooldown_after_take_profit: 15
  cooldown_after_stop_loss: 30
straddle:
  enabled: true
  trigger_seconds: 60
  max_diff_pct: 0.02
  limit_price: 0.05
  shares: 100
  max_cost: 10.0
preposition:
  enabled: true
  trigger_seconds: 30        # start looking for preposition in last N seconds of window
  min_momentum_pct: 0.04    # BTC must have moved this % from window open (strong move)
  min_accel_pct: 0.01       # diff_pct must have grown by this much since last scan (accelerating)
  max_price: 0.55           # max price to pay on next window (near 50/50 = cheap)
  bet_fraction: 0.5         # fraction of normal bet size to use (half-size = cautious)
hedge:
  enabled: true
  min_prob: 0.80           # our probability must be this high before hedging
  min_profit_pct: 0.10     # only hedge if guaranteed profit >= 10% of cost
  max_hedge_cost: 5.0      # max USDC to spend on insurance side
  min_seconds_left: 30     # need at least this much time left to place hedge
risk:
  max_concurrent_positions: 1
  cooldown_after_loss: 30
  max_consecutive_losses: 5
logging:
  db_path: ./data/trades.db
  log_level: INFO
# ── AI news-trading engine (src/news_trader) ── isolated from the BTC engine.
# Paper mode only. "mode: live" alone does NOT enable real orders: see
# execution.LiveAuthorization (code release flag, CLI flag, env acknowledgement,
# Polymarket geoblock check, credentials). Omitted keys use defaults in
# src/news_trader/config.py.
news_trader:
  enabled: true
  mode: paper
  emergency_stop: false
  categories: [monetary_policy, economics, corporate, politics, geopolitics, crypto, sports, general]
  sources:
    min_credibility: 0.6
    user_agent: "Polybot-NewsTrader/1.0 (research; contact: set-your-email@example.com)"
  ai:
    provider: anthropic
    model: claude-opus-5-5
    effort: medium
    max_calls_per_day: 60
    daily_budget_usd: 3.0
    probability_weight: 0.5
  risk:
    max_trade_usd: 10.0
    max_market_exposure_usd: 20.0
    max_daily_exposure_usd: 100.0
    max_correlated_exposure_usd: 30.0
    max_open_positions: 10
    daily_loss_limit_usd: 30.0
    min_edge: 0.04
    min_confidence: 0.6
    max_uncertainty: 0.25
    max_news_age_seconds: 900
    max_decision_latency_seconds: 120
    max_quote_age_seconds: 10
    max_spread: 0.06
    paper_bankroll_usd: 500.0
  execution:
    order_timeout_seconds: 30
    paper_depth_haircut: 0.5
    paper_latency_ms: 500
    exit_policy: hold_to_resolution
